<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; width:1200px; height:630px; background:#0b0b0f; overflow:hidden;
         font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
         display:flex; align-items:center; justify-content:center; }
  body::before { content:''; position:fixed; inset:0;
         background: radial-gradient(700px 500px at 50% -160px, rgba(150,60,230,.22), transparent 70%); }
  .wrap { position:relative; display:flex; align-items:center; gap:56px; }
  img { width:260px; height:260px; }
  h1 { margin:0; color:#f5f5f7; font-size:64px; letter-spacing:-.02em; line-height:1.1; font-weight:700; }
  p  { margin:18px 0 0; color:#98989f; font-size:26px; max-width:560px; line-height:1.4; }
  .brand { display:flex; align-items:center; gap:10px; color:#98989f; font-size:24px;
           font-weight:600; margin-bottom:20px; }
</style></head>
<body>
  <div class="wrap">
    <img src="etna-stone.png" alt="">
    <div>
      <div class="brand">Etna</div>
      <h1>Meeting notes, living<br>natively on your Mac</h1>
      <p>On-device transcription, straight into your Obsidian vault. No servers, no subscription.</p>
    </div>
  </div>
</body></html>
